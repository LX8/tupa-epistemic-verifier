name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run release unit and soundness tests
        run: cargo test --release
      - name: Run offline Riemann / Lean 4 trust-boundary CLI smoke check
        run: cargo run --release -- riemann-audit

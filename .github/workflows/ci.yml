name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run release unit and severe-testing mutant suite
        run: cargo test --release
      - name: Run offline CLI self-checks (default, Lean 4 / Riemann, biomolecular severe-testing)
        run: |
          cargo run --release
          cargo run --release -- riemann-audit
          cargo run --release -- structural-selftest
      - name: Verify zero-dependency WebAssembly library compilation
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --release --target wasm32-unknown-unknown --lib
